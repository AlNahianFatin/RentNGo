<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Insurance Options</title>
  <link rel="stylesheet" href="../asset/insuranceOptions_M.css" />
</head>
<body>
  <form id="insuranceForm" method="POST" action="InsuranceOptions_M.php">
    <h2>Insurance Options</h2>

    <label for="coverageTier">Coverage Tier :</label>
    <select id="coverageTier" name="coverageTier">
      <option value="">Select</option>
      <option value="basic">Basic</option>
      <option value="standard">Standard</option>
      <option value="premium">Premium</option>
    </select>

    <label for="deductible">Deductible Amount :</label>
    <input type="number" id="deductible" name="deductible" />

    <label for="claimScenario">Claim Scenario :</label>
    <textarea id="claimScenario" name="claimScenario" rows="4"></textarea>

    <button type="submit">Submit Insurance</button>
    <p id="errorMessage" class="error"></p>
  </form>

  <script src="../asset/insuranceOptions_M.js"></script>
  <script src="../asset/insuranceOptions2_M.js"></script>
</body>
</html>
