<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pricing Calculator</title>
  <link rel="stylesheet" href="../asset/pricingCalculator_M.css" />
</head>
<body>
  <form id="pricingForm" method="POST" action="PricingCalculator_M.php">
    <h2>Pricing Calculator</h2>

    <label for="startDate">Start Date :</label>
    <input type="date" id="startDate" name="startDate" />

    <label for="endDate">End Date :</label>
    <input type="date" id="endDate" name="endDate" />

    <label for="vehicleType">Vehicle Type :</label>
    <select id="vehicleType" name="vehicleType">
      <option value="">Choose</option>
      <option value="Premio">Premio</option>
      <option value="Prado">Prado</option>
      <option value="Hiace">Hiace</option>
      <option value="BMW">BMW</option>
      <option value="Allion">Allion</option>
    </select>

    <label for="promoCode">Promo Code :</label>
    <input type="text" id="promoCode" name="promoCode" />

    <button type="submit">Calculate Price</button>
    <p id="errorMessage" class="error"></p>
  </form>

  <script src="../asset/pricingCalculator_M.js"></script>
  <script src="../asset/pricingCalculator2_M.js"></script>
</body>
</html>
